[package]
name = "claude-status"
version = "0.1.0"
edition = "2024"
description = "Terminal UI for the Claude status page"
license = "MIT OR Apache-2.0"
rust-version = "1.86"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
color-eyre = "0.6"
clap = { version = "4", features = ["derive"] }
tui-overlay = "0.1"
tui-skeleton = "0.3"
opaline = { version = "0.4", features = ["builtin-themes", "ratatui", "discovery"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
