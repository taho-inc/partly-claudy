[package]
name = "partly-claudy"
version = "0.1.1"
edition = "2024"
description = "Terminal UI for the Claude status page"
license = "MIT OR Apache-2.0"
rust-version = "1.86"
repository = "https://github.com/taho-inc/partly-claudy"
homepage = "https://github.com/taho-inc/partly-claudy"
keywords = ["tui", "ratatui", "claude", "statuspage", "monitoring"]
categories = ["command-line-utilities"]
# Screenshots / gifs are README assets only — fetched from GitHub via
# the raw URL on crates.io, not needed in the published tarball.
exclude = ["screenshots/*"]

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
color-eyre = "0.6"
clap = { version = "4", features = ["derive"] }
tui-overlay = "0.1"
tui-skeleton = "0.3"
opaline = { version = "0.4", features = ["builtin-themes", "ratatui", "discovery"] }
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
